<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a9cfdf">
<title>Задача трета — Освободи червеното блокче</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%88%9E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .screen.s3{--ink:#023859;--muted:#0d5179;--dim:#0d5179;--faint:#2f6076;--accent:#26658C}
  .s3 .progress{background:rgba(2,56,89,.06);border-color:rgba(2,56,89,.16)}
  .s3 .progress .dot{border-color:rgba(2,56,89,.3)}
  .s3 .progress .dot.done{background:rgba(2,56,89,.55);border-color:transparent}
  .s3 .progress .dot.now{background:#26658C;box-shadow:0 0 0 5px rgba(38,101,140,.18),0 0 18px rgba(38,101,140,.5)}
  .s3 .progress .bar{background:rgba(2,56,89,.2)}
  .s3 .btn{color:#023859;border-color:rgba(2,56,89,.4)}
  .s3 .btn:hover{border-color:#26658C;color:#012437;box-shadow:0 0 36px -12px rgba(38,101,140,.45)}
  .s3 .eyebrow{color:#26658C}

  .board{
    position:relative;border-radius:12px;background:rgba(255,255,255,.36);
    box-shadow:0 33px 82px -42px rgba(40,72,116,.5),inset 0 0 105px rgba(255,255,255,.35);
    touch-action:none;margin:0 auto;
  }
  .board .edge{position:absolute;background:rgba(38,101,140,.34)}
  .exitglow{position:absolute;bottom:-3px;height:9px;
    background:linear-gradient(0deg,rgba(216,83,74,0),rgba(216,83,74,.55));animation:pulse 2.4s ease-in-out infinite}
  .exitarrow{font-family:var(--mono);color:#e0817a;text-align:center;
    animation:arrow 1.8s ease-in-out infinite;margin-top:10px;line-height:1}
  .piece{
    position:absolute;left:0;top:0;border-radius:10px;display:grid;place-items:center;
    touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
    background:linear-gradient(160deg,#54ACBF,#26658C);
    border:3px solid rgba(255,255,255,.5);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 8px 21px -10px rgba(2,56,89,.45);
    -webkit-tap-highlight-color:transparent;
  }
  .piece.target{
    background:linear-gradient(160deg,#e85c50,#c43c32);border-color:#f7b3ac;
    box-shadow:0 15px 42px -9px rgba(216,83,74,.55),inset 0 1.5px 0 rgba(255,255,255,.4);
    color:rgba(255,255,255,.9);font-family:var(--mono);
  }
  .piece.dragging{cursor:grabbing;z-index:9}
  .controls{display:flex;align-items:center;gap:clamp(20px,5vw,42px);
    margin-top:clamp(18px,3vw,36px);flex-wrap:wrap;justify-content:center}
  /* the board wants the vertical budget more than the margins do */
  .screen.s3{padding-top:clamp(70px,11vh,96px);padding-bottom:clamp(20px,3.5vh,40px)}
  .s3 .puzzlesub{margin-top:clamp(8px,1.6vw,15px)}
  .controls .count{font-family:var(--mono);font-size:var(--fs-micro);letter-spacing:.16em;
    text-transform:uppercase;color:#2f6076}
  .s3 .done-panel .big,.s3 .h2{color:#023859}
  .s3 .done-panel .sub{color:#0d5179}
  .puzzletitle{font-family:var(--hand);font-weight:700;font-size:clamp(30px,6.6vw,60px);
    color:#023859;line-height:1.05;margin:0}
  .puzzlesub{font-family:var(--serif);font-size:clamp(16px,3.2vw,30px);color:#0d5179;
    margin:15px auto 0;max-width:840px}
  /* secret skip: faint pi in the bottom-left corner. Deliberately clear of the
     board — at the original left:7%/top:80% it overlapped the board edge on
     phones and would have swallowed drags. */
  .skip{position:absolute;left:clamp(6px,3vw,40px);bottom:clamp(4px,3vh,36px);
    font-family:var(--mono);font-size:clamp(34px,7vw,63px);line-height:1;
    color:#26658C;opacity:.10;cursor:pointer;z-index:2;padding:10px;
    background:none;border:none;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;transition:opacity .3s}
  .skip:hover{opacity:.28}
</style>
</head>
<body>
<main class="screen s3">
  <div class="progress" data-progress="3"></div>

  <p class="eyebrow fade-1" style="position:relative;z-index:2;margin-bottom:clamp(10px,2vw,21px)">Задача&nbsp;трета</p>

  <div class="content fade-2" style="margin-bottom:clamp(18px,3.4vw,36px)">
    <h1 class="puzzletitle">Освободи червеното блокче</h1>
    <p class="puzzlesub">Плъзгай блокчетата, за да освободиш път, и изведи червеното навън през отвора долу.</p>
  </div>

  <div id="play" class="content fade-3">
    <div class="board" id="board"></div>
    <div class="exitarrow" id="arrow">↓</div>
    <div class="controls">
      <span class="count">Ходове&nbsp;·&nbsp;<span id="moves" style="color:#26658C">0</span></span>
      <button class="linkbtn" id="reset" type="button">↺ Отначало</button>
    </div>
  </div>

  <div class="done-panel content" id="won" hidden>
    <svg class="tick" viewBox="0 0 52 52" fill="none" stroke="#d8534a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 27 22 37 41 15" stroke-dasharray="60" stroke-dashoffset="60" style="animation:draw .7s cubic-bezier(.2,.7,.2,1) .1s forwards"/>
    </svg>
    <p class="big">Свободно е!</p>
    <p class="sub" id="wonSub">Изведе го за <span id="finalMoves">0</span> хода. Знаех си, че ще намериш пътя — както винаги.</p>
    <a class="btn sm" href="ocenki.html">Твоят фиш с оценки&nbsp;&nbsp;→</a>
    <button class="linkbtn" id="retry" type="button">↺ Опитай пак</button>
  </div>
  <button class="skip" id="skip" type="button" tabindex="-1" aria-hidden="true">&#960;</button>

</main>

<script src="assets/app.js"></script>
<script src="assets/puzzle.js"></script>
</body>
</html>
